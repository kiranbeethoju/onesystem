[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onesystem"
version = "0.1.0"
description = "OneSystem is a local specialist model for operational decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OneSystem contributors" }]
keywords = ["decisions", "classification", "lora", "onesystem"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
local = ["gliner2[local]>=2.0.0,<3"]
dev = ["pytest>=8"]

[project.scripts]
onesystem = "onesystem.cli:main"
onesystem-train = "onesystem.train:main"
onesystem-eval = "onesystem.evaluate:main"

[tool.setuptools.packages.find]
include = ["onesystem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
