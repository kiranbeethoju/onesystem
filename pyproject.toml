[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onesystem"
version = "0.3.0"
description = "OneSystem: a System-1 decision engine for LLM pipelines — typed, calibrated decisions before expensive reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kiran Beethoju" }]
keywords = ["decisions", "classification", "system-one", "calibration", "onesystem"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7"]

[project.scripts]
onesystem = "onesystem.cli:main"
onesystem-train = "onesystem.train:main"
onesystem-eval = "onesystem.evaluate:main"

[tool.setuptools.packages.find]
include = ["onesystem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
