name: Bug report
description: Something in OneSystem failed
title: "[bug] "
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Python version, operating system, and whether you used the Apple GPU, CUDA, or CPU.
    validations:
      required: true
